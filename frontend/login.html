<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — RecipeShare</title>
    <meta name="description" content="Log in to RecipeShare to create and share your favorite recipes.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1 class="brand"> RecipeShare</h1>
            <p class="subtitle">Welcome back. Log in to continue.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Your username" required autocomplete="username" />
                    <div class="form-error-text" id="usernameError"></div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Your password" required autocomplete="current-password" />
                    <div class="form-error-text" id="passwordError"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Log In</button>
            </form>
            <p class="auth-footer">Don't have an account? <a href="register.html">Create one</a></p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
