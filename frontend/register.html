<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — RecipeShare</title>
    <meta name="description" content="Create a RecipeShare account to start sharing your recipes.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1 class="brand"> RecipeShare</h1>
            <p class="subtitle">Create your account to get started.</p>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Choose a username" required autocomplete="username" />
                    <div class="form-error-text" id="usernameError"></div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
                    <div class="form-error-text" id="emailError"></div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="At least 8 characters" required autocomplete="new-password" />
                    <p class="form-hint">Must be at least 8 characters long.</p>
                    <div class="form-error-text" id="passwordError"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Create Account</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
